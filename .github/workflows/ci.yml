name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: schema and references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML
        # validate.sh skips its YAML check without a parser. CI is the place
        # where that check must actually run, so the dependency is explicit.
        run: python3 -m pip install --user pyyaml
      - run: bash scripts/validate.sh

  tests:
    name: installer, adapters, routing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not optional: the link handling, path canonicalisation and
        # the silent-copy hazard only exist there.
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/run.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        # -x follows `source` directives into lib/. Warnings are advisory;
        # errors fail the build.
        run: shellcheck -x -S error scripts/*.sh scripts/adapters/*.sh scripts/lib/*.sh tests/*.sh tests/lib/*.sh

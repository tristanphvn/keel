# Adapter-owned routing configuration — EXAMPLE. Copy to models.yaml and edit.
#
# The agent-work contract (0.2.0) defines LOGICAL model policies — `default` and
# `escalated` — and deliberately defines no model names, providers, prices or
# reasoning settings. This file is where those logical policies are bound to
# concrete identifiers, per runtime. It is owned by the adapter, not by the
# contract: changing a binding here changes no role profile and no skill body.
#
# It holds no role definitions. Roles come from roles/catalog.json and the
# roles/<id>.json profiles; there is exactly one role source.
#
# A policy the catalog declares but this file does not bind is a configuration
# error. The renderer stops. It never guesses a model name.

version: 2

# --- logical policy -> concrete model ----------------------------------------
policies:
  default:
    claude:
      model: sonnet          # CLI alias, verified: resolves to claude-sonnet-5
    codex:
      model: gpt-5.6         # EXAMPLE — unverified here, the Codex CLI was not installed
      reasoning: medium      # model_reasoning_effort: low | medium | high | xhigh
  escalated:
    claude:
      model: opus
    codex:
      model: gpt-5.6         # EXAMPLE — bind to the model you have verified
      reasoning: high

# Reasoning is bound per policy, not per model: the same model is used at
# different depths. Claude Code documents no per-agent reasoning key, so none is
# emitted there — see docs/runtime-capabilities.md rather than inventing one.

# --- per-role runtime options ------------------------------------------------
# Optional. Keyed by the role ids in roles/catalog.json. Nothing here changes a
# role's responsibilities, boundaries or criteria — only how the runtime is
# configured to execute it.
#
#   claude.tools     explicit tool allowlist. Omit to inherit the parent's set.
#   codex.sandbox_mode   read-only | workspace-write
#   skill_delivery   reference | preload — override the automatic choice
#
# Skill delivery, measured on Claude Code 2.1.220: an agent given an explicit
# `tools` list without `Skill` has no Skill tool, and therefore receives no
# skills at all. Where a role's tools are restricted, the renderer PRELOADS the
# canonical skill bodies into the generated instructions instead of widening the
# permission. The copies carry their source path, sha256 and revision.
roles:
  review:
    claude:
      tools: [Read, Grep, Glob, Bash]
    codex:
      sandbox_mode: read-only
  security:
    claude:
      tools: [Read, Grep, Glob, Bash]
    codex:
      sandbox_mode: read-only
  research:
    claude:
      tools: [Read, Grep, Glob, WebSearch, WebFetch]
  critical-thinking:
    claude:
      tools: [Read, Grep, Glob]
  documentation:
    codex:
      sandbox_mode: workspace-write

# Escalation binding, for reference: a role whose profile carries
# `model_policy_ref: escalated` resolves through policies.escalated above. The
# contract's budget (one escalation per task by default) is enforced by the
# orchestrator, not by this file — rendering a definition grants nothing.

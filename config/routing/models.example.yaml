# Adapter-owned routing configuration — EXAMPLE. Copy to models.yaml and edit.
#
# The agent-work contract (0.3.0 draft) defines LOGICAL model policies —
# `default` and `escalated` — and permission CLASSES. It defines no model names,
# no providers, no reasoning settings and no tool names, because all four are
# runtime-specific. Binding them is this file's job, and only this file's job.
#
# It holds no role definitions. Roles come from roles/catalog.json and the
# roles/<id>.json profiles; there is exactly one role source.

version: 3

# --- logical policy -> concrete model ----------------------------------------
policies:
  default:
    claude:
      model: sonnet          # CLI alias, verified: resolves to claude-sonnet-5
    codex:
      model: gpt-5.6         # EXAMPLE — unverified here, the Codex CLI was not installed
      reasoning: medium      # model_reasoning_effort: low | medium | high | xhigh
  escalated:
    claude:
      model: opus
    codex:
      model: gpt-5.6         # EXAMPLE — bind to a model you have verified
      reasoning: high

# Reasoning is bound per policy, not per model: the same model is used at
# different depths. Claude Code documents no per-agent reasoning key, so none is
# emitted there — see docs/runtime-capabilities.md rather than inventing one.

# --- permission class -> runtime tool names ----------------------------------
# The contract says what a role NEEDS, in runtime-independent permission classes.
# This map says which tools of this runtime provide each class. The renderer
# derives a role's tool limit from its `required_permissions` through this map,
# so the same contract plus the same map produces the same limit on every
# machine — and no adapter decides, per role, what a role is allowed to do.
#
# A class a role requires but this map does not cover is a configuration error:
# the renderer stops rather than silently dropping a capability the role needs.
tool_map:
  claude:
    read:     [Read, Grep, Glob]
    write:    [Write, Edit]
    execute:  [Bash]
    network:  [WebSearch, WebFetch]
    delegate: [Agent]
  codex:
    # Codex tool identifiers are not verified here — the CLI was not installed.
    # Left empty on purpose: an empty class fails loudly when a role requires it,
    # which is better than a guessed tool name that silently does nothing.
    read:     []
    write:    []
    execute:  []
    network:  []
    delegate: []

# --- per-role runtime options ------------------------------------------------
# Optional, keyed by the role ids in roles/catalog.json. Nothing here changes a
# role's responsibilities, boundaries or criteria.
#
#   codex.sandbox_mode      read-only | workspace-write
#   skill_delivery          reference | preload — override the automatic choice
#   <runtime>.tools_override + justification
#                           an adapter-declared tool limit, for the case the
#                           contract does not cover. It REQUIRES a justification,
#                           and the generated file is stamped ADAPTER-DECLARED so
#                           nobody mistakes it for something the contract asked
#                           for. Prefer populating the role's required_permissions.
#
# Skill delivery, measured on Claude Code 2.1.220: an agent given an explicit
# tool list without `Skill` has no Skill tool, and a control run confirmed such a
# child receives no skill text at all under `reference` delivery. Where a role's
# tools are limited, the renderer PRELOADS the canonical skill bodies instead of
# widening the permission. The copies carry their source path and sha256.
roles:
  # `permissions` is the AUTHORIZED permission set for this role on this host:
  # what an operator actually grants. The contract's inequality applies —
  #
  #     role.required_permissions  ⊆  permissions  ⊆  role.permission_ceiling
  #
  # — and the renderer checks both halves. The floor is a minimum, not an
  # allowlist: `review` has a `read` floor but is authorized `read, write` here
  # so it can save its report, which is the contract's own example.
  #
  # Without a `permissions` entry the renderer produces a NON-EXECUTABLE
  # TEMPLATE: it will not claim an authorized, restricted execution from a role
  # profile alone, because an agent file with no tool limit inherits whatever
  # the parent has.
  review:
    claude:
      permissions: [read, write]
    codex:
      sandbox_mode: read-only
  security:
    claude:
      permissions: [read, execute]
    codex:
      sandbox_mode: read-only
  testing:
    claude:
      permissions: [read, execute]
  documentation:
    claude:
      permissions: [read, write]
    codex:
      sandbox_mode: workspace-write

# Authorization is scoped per runtime here, because a grant is only meaningful
# where the tools that implement it exist. It may also be written once per role
# (`permissions:` directly under the role) or run-wide as
# `default_authorized_permissions:`; the most specific wins.
#
# Nothing is authorized for Codex, deliberately. Its tool_map is empty because no
# Codex tool identifier has been verified here, so an authorized Codex role would
# fail with an unmapped-class error — which is the honest outcome. Codex roles
# therefore render as non-executable templates until a measured mapping exists.
# default_authorized_permissions: [read]

# `tools_override` remains available for an operator exception the contract does
# not cover. It still has to satisfy the role's floor — a justification does not
# exempt it — and an explicitly empty list means NO tools, never inherited ones.
# See docs/decisions/0001-contract-c1-c5.md and 0004-permission-capability-review.md.

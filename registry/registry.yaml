# Global skill registry — management metadata only.
# SKILL.md frontmatter carries only what the agent runtime supports (name, description).
# Everything else about a skill's lifecycle lives here.
#
# status: draft | active | deprecated | replaced
# When status is `replaced`, set `replaced_by: <skill-id>`.
# `legacy_name` = the current on-disk directory name when it does not yet match
# the <domain>-<skill-name> convention. Migration is deliberate and not yet done.

version: 1
updated: 2026-09-21

conventions:
  skill_path: {{AGENT_HOME}}/skills/<skill-name>/SKILL.md
  naming: <domain>-<skill-name>
  domains: [core, review, eng, design, sec, data, ops]
  project_skill_path: <repository>/<agent-config-dir>/skills/

skills:
  - id: core-self-correction
    legacy_name: self-correction-coding-discipline
    domain: core
    status: active
    auto_trigger: true
    purpose: Source-grounded engineering, scope control, verification honesty, and the correction workflow after a wrong assumption.
    depends_on: []
    rules:
      - VERIFY-001
      - VERIFY-002
      - SCOPE-001
      - TEST-001
      - CORRECTION-001
    version: 1
    notes: >
      Oversized — carries core, eng, and ops concerns at once. Candidate for a
      later split into core-self-correction + eng-coding-discipline +
      ops-completion-handoff. Do not split without re-verifying cross-references.

  - id: review-intent-first
    legacy_name: intent-first-review
    domain: review
    status: active
    auto_trigger: true
    purpose: Judge tasks and specs by intent, behavior, scope, and correctness — never wording, style, or grammar.
    depends_on: []
    rules: [REVIEW-001, REVIEW-002, REVIEW-003]
    version: 1

  - id: review-adversarial-consensus
    legacy_name: adversarial-consensus
    domain: review
    status: active
    auto_trigger: true
    purpose: Independent defense, adversarial falsification, and evidence-based adjudication for high-stakes conclusions.
    depends_on:
      - core-self-correction
      - review-intent-first
    rules: [CONSENSUS-001, CONSENSUS-002, CONSENSUS-003, CONSENSUS-004]
    version: 1

  - id: review-code
    legacy_name: strict-review
    domain: review
    status: active
    auto_trigger: true
    purpose: Review someone else's code — PR, branch diff, handed-over file — with severity ladder and file:line evidence.
    depends_on:
      - review-intent-first
      - review-adversarial-consensus
    rules: [TEST-001, REVIEW-002]
    version: 1
    notes: >
      Physically migrated 2026-09-18 (pilot). On-disk directory is now
      `review-code`; `legacy_name` is retained as provenance only, not as a
      current path. Backup: backups/reorg-20260917/pilot-review-code/.

  - id: design-ui-discipline
    legacy_name: ui-design-discipline
    domain: design
    status: active
    auto_trigger: true
    purpose: Reference-backed UI design — authority order, human-designed references, anti-AI-slop review.
    depends_on: []
    rules: [UI-001, UI-002, UI-003, UI-004]
    version: 1

  - id: ops-ticket-pr
    legacy_name: ticket-pr
    domain: ops
    status: active
    auto_trigger: true
    purpose: Write ticket reports, PR descriptions, QA cards, and estimations from vault templates.
    depends_on:
      - review-intent-first
    rules: [TEST-001, SCOPE-003]
    version: 1

  - id: ops-vault-rules
    legacy_name: vault-rules
    domain: ops
    status: active
    auto_trigger: true
    purpose: Load universal engineering rules, project overrides, and the active work card for the current branch.
    depends_on: []
    rules: []
    version: 1

  - id: eng-workos
    legacy_name: workos
    domain: eng
    status: active
    auto_trigger: true
    purpose: WorkOS AuthKit, SSO, Directory Sync, RBAC, webhooks, CLI, and migration guidance.
    depends_on: []
    rules: []
    version: 1
    notes: Vendor skill, externally maintained. Do not rename or hand-edit; it is refreshed by the WorkOS installer.

  - id: eng-workos-widgets
    legacy_name: workos-widgets
    domain: eng
    status: active
    auto_trigger: true
    purpose: Implement and debug WorkOS embeddable widgets across supported frontends and backend SDKs.
    depends_on:
      - eng-workos
    rules: []
    version: 1
    notes: Vendor skill, externally maintained.

  - id: core-self-correction-regression
    legacy_name: self-correction-regression
    domain: core
    status: replaced
    replaced_by: core-self-correction
    auto_trigger: false
    purpose: Original correction-incident workflow; absorbed as a strict subset.
    depends_on: []
    rules: []
    version: 1
    notes: Removed from {{AGENT_HOME}}/skills on 2026-09-17. Backup at {{AGENT_HOME}}/backups/self-correction-regression-20260917/SKILL.md.

  - id: core-orchestrate
    domain: core
    status: active
    auto_trigger: true
    purpose: Coordinate scoped work across role profiles when a task benefits from delegation, multiple disciplines, or independent verification. Use for task dispatch, handoffs, conflict resolution, and bounded agent workflows.
    depends_on: []
    rules: [VERIFY-003, SCOPE-001, SCOPE-003, TEST-001, CONSENSUS-002, CONSENSUS-004]
    version: 1

  - id: core-research-evidence
    domain: core
    status: active
    auto_trigger: true
    purpose: Gather and assess evidence for technical or product questions. Use for research, comparisons, uncertain claims, and investigations requiring source provenance.
    depends_on: []
    rules: [VERIFY-001, VERIFY-002, CODE-001, SCOPE-003, TEST-001]
    version: 1

  - id: core-product-discovery
    domain: core
    status: active
    auto_trigger: true
    purpose: Evaluate startup ideas, customer problems, value propositions, MVP boundaries and business hypotheses. Use for product thinking and deciding what to validate before building.
    depends_on: []
    rules: [VERIFY-001, VERIFY-002, REVIEW-004, SCOPE-001, SCOPE-003]
    version: 1

  - id: core-plan-work
    domain: core
    status: active
    auto_trigger: true
    purpose: Convert an accepted objective into bounded work with dependencies and measurable acceptance. Use for implementation plans, milestones, sequencing and replanning after verified blockers.
    depends_on: []
    rules: [SCOPE-001, REVIEW-003, REVIEW-004, VERIFY-001, TEST-001]
    version: 1

  - id: eng-design-architecture
    domain: eng
    status: active
    auto_trigger: true
    purpose: Design technical boundaries and evaluate implementation tradeoffs. Use for architecture decisions, API/data contracts, concurrency design and cross-component changes.
    depends_on: []
    rules: [CODE-001, CODE-002, ROOT-001, SCOPE-001, CONSENSUS-001]
    version: 1

  - id: eng-test-behavior
    domain: eng
    status: active
    auto_trigger: true
    purpose: Design and execute meaningful behavior checks against acceptance criteria. Use for regression tests, reproductions, integration verification and QA evidence.
    depends_on: []
    rules: [TEST-001, VERIFY-001, API-001, API-002, SCOPE-001, SCOPE-003]
    version: 1

  - id: sec-security-review
    domain: sec
    status: active
    auto_trigger: true
    purpose: Review authentication, authorization, trust boundaries, tenant isolation, secrets and sensitive data handling. Use for security reviews and threat modeling of scoped changes.
    depends_on: []
    rules: [CODE-002, VERIFY-002, TEST-001, SCOPE-003, CONSENSUS-001, CONSENSUS-002]
    version: 1

  - id: ops-release-readiness
    domain: ops
    status: active
    auto_trigger: true
    purpose: Assess build, environment, deployment and rollback readiness. Use for infrastructure changes, CI/CD design and operational handoff; execution still requires task authorization.
    depends_on: []
    rules: [VERIFY-001, API-002, SCOPE-001, SCOPE-003, TEST-001]
    version: 1

  - id: docs-evidence-handoff
    domain: ops
    status: active
    auto_trigger: true
    purpose: Write evidence-backed documentation and concise completion handoffs from actual work. Use for guides, decisions, task results and integration notes without requiring a project-specific template service.
    depends_on: []
    rules: [VERIFY-002, VERIFY-003, TEST-001, REVIEW-002, SCOPE-003]
    version: 1

# Planned — architecture only, not yet authored. Do not create until requested.
  - id: core-english-work-coach
    legacy_name: english-work-coach
    domain: core
    status: active
    auto_trigger: false
    purpose: Opt-in English lessons and work-prompt coaching with modality-aware assessment and separate learner progress.
    depends_on: []
    rules: [REVIEW-001, REVIEW-003, REVIEW-004]
    version: 1
    notes: Explicit activation or an established coaching session only; runtime copies derive from skills/english-work-coach.


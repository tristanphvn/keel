version: 1

catalog:
  - tier: deep
    claude:
      model: opus
    codex:
      model: gpt-5.6
  - tier: cheap
    claude:
      model: haiku

reasoning:
  default: medium
  levels: [low, medium, high, xhigh]

fallback:
  on_unknown_model: deny
  on_missing_capability: [degrade_to_inline, deny]

roles:
  - id: reviewer
    profile: profiles/reviewer.md
    tier: deep
    reasoning: high
    claude:
      tools: [Read, Grep, Glob]
    codex:
      sandbox_mode: read-only
